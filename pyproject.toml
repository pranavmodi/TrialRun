[project]
name = "pi-firm-lab"
version = "0.1.0"
description = "Standalone PI firm simulation and agent evaluation environment"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]
[project.optional-dependencies]
test = ["pytest>=8,<10", "playwright>=1.48,<2"]
[project.scripts]
firm-lab = "firm_lab.cli:main"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools]
include-package-data = false
[tool.setuptools.package-data]
firm_lab = ["static/*"]
[tool.setuptools.packages.find]
include = ["firm_lab*"]
namespaces = false
[tool.pytest.ini_options]
testpaths = ["tests"]
